# Local development environment for the Hiilipörssi Odoo 20 Community prototype.
# Odoo core comes from the official image; only custom addons live in ./addons.
# See README.md for usage.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  odoo:
    image: odoo:20.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Read by the official image entrypoint to connect to the db service.
      # Local development only; do not reuse these credentials anywhere else.
      HOST: db
      USER: odoo
      PASSWORD: odoo
      # Dev mode: reload Python changes, and reload QWeb and XML views.
      ODOO_DEV: reload,qweb,xml
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons

volumes:
  odoo-db:
  odoo-data:
